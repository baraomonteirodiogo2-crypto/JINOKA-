<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12171D">
<title>JINOKA Stock</title>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho escuro com etiqueta de preço, separadores em linha, conteúdo em cartões sobre fundo azul-cinza frio. Telemóvel e computador. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1;
  --ink:#12171D; --muted:#566370;
  --line:#D7DDE3; --line-strong:#B3BCC6;
  --accent:#E0A100; --chart:#B97D00;
  --head-bg:#12171D; --head-fg:#F4F6F8;
  --btn-bg:#12171D; --btn-fg:#FFFFFF;
  --link:#1F4FD6; --focus:#2F5BEA;
  --good:#0E7A4F; --good-bg:#DDF3E8;
  --warn:#8A4B00; --warn-bg:#FCEBCB;
  --bad:#B3261E; --bad-bg:#FADAD7;
  --danger-bg:#B3261E; --danger-fg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --surface:#161C22; --surface-2:#1F272F;
    --ink:#EEF1F4; --muted:#9AA6B2;
    --line:#2A343D; --line-strong:#43505C;
    --accent:#F0B90B; --chart:#F0B90B;
    --head-bg:#080B0E; --head-fg:#F4F6F8;
    --btn-bg:#F0B90B; --btn-fg:#10151A;
    --link:#8FB0FF; --focus:#8FA9FF;
    --good:#4FD39B; --good-bg:#12362A;
    --warn:#F2B15A; --warn-bg:#3A2A10;
    --bad:#FF8A80; --bad-bg:#3F1B18;
    --danger-bg:#FF8A80; --danger-fg:#2A0C0A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#161C22; --surface-2:#1F272F;
  --ink:#EEF1F4; --muted:#9AA6B2;
  --line:#2A343D; --line-strong:#43505C;
  --accent:#F0B90B; --chart:#F0B90B;
  --head-bg:#080B0E; --head-fg:#F4F6F8;
  --btn-bg:#F0B90B; --btn-fg:#10151A;
  --link:#8FB0FF; --focus:#8FA9FF;
  --good:#4FD39B; --good-bg:#12362A;
  --warn:#F2B15A; --warn-bg:#3A2A10;
  --bad:#FF8A80; --bad-bg:#3F1B18;
  --danger-bg:#FF8A80; --danger-fg:#2A0C0A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.stack{display:grid;gap:14px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* marca */
.brand{display:flex;align-items:center;gap:10px}
.brandbtn{background:none;border:0;padding:0;margin:0;color:inherit;cursor:pointer;text-align:left}
.brand svg{width:30px;height:30px;flex:none}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1;display:block}
.slogan{font-size:12px;opacity:.75;margin-top:2px;display:block}

/* acesso */
.auth{padding-block:40px;padding-inline:16px}
.authcard{max-width:440px;margin-inline:auto;display:grid;gap:20px}
.authcard .brand{color:var(--ink)}
.authcard .brand svg{width:44px;height:44px}
.authcard .wordmark{font-size:34px}
.authcard .slogan{font-size:14px;color:var(--muted);opacity:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.pwrow{display:flex;gap:8px}

/* cabeçalho e separadores */
.top{background:var(--head-bg);color:var(--head-fg)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.topright{display:flex;gap:12px;align-items:center}
.top .slogan{margin:0}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;display:flex;gap:6px;align-items:center;background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;font-weight:600;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;padding:0 6px;border-radius:10px;background:var(--danger-bg);color:var(--danger-fg);font-size:12px;line-height:20px;text-align:center}
main{padding-block:20px 56px;display:grid;gap:18px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-bg);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger-fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.top .btn.ghost{color:var(--head-fg);border-color:rgba(255,255,255,.35)}
.link{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;justify-self:start}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
input,select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px}
textarea{resize:vertical;min-height:64px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));align-items:end}
.span-all{grid-column:1/-1}
.err{color:var(--bad);font-size:14px;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions.left{justify-content:flex-start}
.clock{font-family:var(--font-mono);font-size:15px;background:var(--surface-2);border-radius:8px;padding:9px 10px}

/* secções */
.sec{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero{display:grid;gap:4px;padding-block:4px}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05}
.hero .eq{font-size:14px;color:var(--muted)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-weight:600;font-size:21px;overflow-wrap:anywhere}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.cols>*{min-width:0}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500}
.notice.info{background:var(--surface-2);color:var(--ink)}
.notice.good{background:var(--good-bg);color:var(--good)}
.preview{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.just{min-width:220px}
.when{white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}

/* caixa */
.ledger{min-width:0}
.ledger td{border-top:1px dotted var(--line-strong);padding-block:11px}
.ledger tr:first-child td{border-top:0}
.ledger .tot td{border-top:2px solid var(--ink);font-family:var(--font-display);font-size:20px;font-weight:600;background:transparent}
.sign{width:28px;color:var(--muted);text-align:center}

/* alertas */
.alist{display:grid;gap:8px}
.aitem{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.aitem strong{font-weight:600}

/* gráfico */
#chart{width:100%;min-height:240px}
#chart svg{display:block;width:100%;height:auto}
#chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
#chart text.endlbl{fill:var(--ink);font-weight:700}

/* janela e aviso */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;max-width:440px;width:100%;max-height:92%;overflow:auto;display:grid;gap:14px}
.modal form{display:grid;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* computador: mais espaço */
@media (min-width:900px){
  body{font-size:16px}
  .wrap{padding-inline:24px}
  main{padding-block:28px 72px;gap:22px}
  .tab{padding-inline:16px}
}
@media (prefers-reduced-motion:no-preference){ .tab{transition:color .15s,border-color .15s} }
</style>
</head>

var LANG='pt',TRMAP={en:{},fr:{},es:{}};
TR.forEach(function(r){TRMAP.en[r[0]]=r[1];TRMAP.fr[r[0]]=r[2];TRMAP.es[r[0]]=r[3];});
function T(s,a){
  var m=(LANG!=='pt'&&TRMAP[LANG]&&TRMAP[LANG][s])||s;
  if(a)m=m.replace(/\{(\d+)\}/g,function(_,i){return a[+i];});
  return m;
}
var nf,pf;
function setLang(l){
  if(!LOC[l])l='pt';
  LANG=l;
  nf=new Intl.NumberFormat(LOC[l],{maximumFractionDigits:2,useGrouping:'always'});
  pf=new Intl.NumberFormat(LOC[l],{maximumFractionDigits:1});
  document.documentElement.lang=l;
  try{localStorage.setItem('jinoka_lang',l);}catch(e){}
}
(function(){var l='pt';try{l=localStorage.getItem('jinoka_lang')||'pt';}catch(e){}setLang(l);})();

/* ---------- formatação ---------- */
var fmtN=function(n){return nf.format(Math.round((+n||0)*100)/100);};
var fmt=function(n){return fmtN(n)+' Kz';};
var pct=function(n){return (n>0?'+':'')+pf.format(n)+'%';};
var pad=function(n){return String(n).padStart(2,'0');};
var fmtD=function(d){var p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'—';};
var fmtTS=function(d){d=d?new Date(d):new Date();if(isNaN(d))return '—';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var monthLabel=function(ym){var p=ym.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString(LOC[LANG],{month:'short',year:'numeric'});};
function kzShort(n){var a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+pf.format(a/1e6)+' M';if(a>=1e3)return s+Math.round(a/1e3)+(LANG==='pt'?' mil':'k');return s+Math.round(a);}
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?NaN:n;};
var catLabel=function(c){return c==='Mercadoria'?T('Aquisição de mercadoria'):c==='Transporte'?T('Transporte'):T('Outro');};

var validPw=function(p){return p.length>=8&&/[A-Za-z]/.test(p)&&/[0-9]/.test(p);};
var validEmail=function(e){return /^[a-z0-9._%+-]+@gmail\.com$/i.test(e);};
function mapAuthError(e){
  var m=String(e&&e.message||'').toLowerCase();
  if(m.indexOf('invalid login')>=0)return T('Gmail ou senha incorretos.');
  if(m.indexOf('not confirmed')>=0)return T('Esta conta ainda não foi ativada. Abre o email com o link de ativação no teu Gmail, ou toca em "Ativar a conta" para receber outro link.');
  if((e&&e.status===429)||m.indexOf('rate limit')>=0||m.indexOf('too many')>=0)return T('Demasiados pedidos. Espera uns minutos e tenta outra vez.');
  if(m.indexOf('same password')>=0||m.indexOf('different from the old')>=0)return T('A nova senha tem de ser diferente da anterior.');
  if(m.indexOf('signups not allowed')>=0||m.indexOf('signup is disabled')>=0)return T('O registo de novas contas está desativado.');
  if(m.indexOf('fetch')>=0||m.indexOf('network')>=0)return T('Sem ligação à internet. Verifica e tenta outra vez.');
  return T('Não foi possível concluir. Tenta outra vez.');
}

}

var stat=function(p){return p.atual<=0?'out':(p.atual<=p.minimo?'low':'ok');};
function calc(){
  var prods=DB.produtos.map(function(p){
    var sold=DB.vendas.reduce(function(a,v){return v.produtoId===p.id?a+v.qtd:a;},0);
    return Object.assign({},p,{sold:sold,atual:p.qtdEntrada-sold});
  });
  var vendido=sum(DB.vendas,function(v){return v.qtd*v.precoVenda;});
  var custoVendido=sum(DB.vendas,function(v){return v.qtd*v.precoReal;});
  var gastos=sum(DB.gastos,function(g){return g.valor;});
  var porCat={Mercadoria:0,Transporte:0,Outro:0};
  DB.gastos.forEach(function(g){porCat[g.categoria]=(porCat[g.categoria]||0)+g.valor;});
  var capital=+DB.capital.valor||0;
  var saldo=capital+vendido-gastos;
  var stockCusto=sum(prods,function(p){return Math.max(0,p.atual)*p.custo;});
  var stockVenda=sum(prods,function(p){return Math.max(0,p.atual)*p.precoVenda;});
  var alerts=prods.filter(function(p){return stat(p)!=='ok';});
  return {prods:prods,vendido:vendido,custoVendido:custoVendido,lucro:vendido-custoVendido,gastos:gastos,porCat:porCat,capital:capital,saldo:saldo,stockCusto:stockCusto,stockVenda:stockVenda,alerts:alerts,patrimonio:saldo+stockCusto};
}
var hasExamples=function(){return DB.capital.ex||DB.produtos.some(function(x){return x.ex;})||DB.vendas.some(function(x){return x.ex;})||DB.gastos.some(function(x){return x.ex;});};

var idleT=null,lastActive=Date.now(),IDLE=10*60*1000;

['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){addEventListener(ev,bump,{passive:true});});

async function lockApp(){
  if(!unlocked)return;
  closeModal();$('#main').innerHTML='';
  try{await sb.auth.signOut();}catch(e){}
  user=null;DB=null;showAuth('a-login');
}
async function enterApp(){
  if(entering||unlocked)return;
  entering=true;
  try{
    await loadData();
    if(!DB){DB=seed();await flush();}
    if(DB.idioma&&DB.idioma!==LANG)setLang(DB.idioma);
    unlocked=true;tab='painel';
    $('#auth').hidden=true;$('#app').hidden=false;
    setSync(T('Guardado'));buildHeader();render();bump();window.scrollTo(0,0);
  }catch(e){
    toast(T('Não foi possível carregar os dados. Verifica a ligação e tenta outra vez.'));
    try{await sb.auth.signOut();}catch(x){}

}

function monthly(){
  var m={};
  function g(k){return m[k]||(m[k]={v:0,g:0,l:0});}
  DB.vendas.forEach(function(v){var o=g(v.data.slice(0,7));o.v+=v.qtd*v.precoVenda;o.l+=(v.precoVenda-v.precoReal)*v.qtd;});
  DB.gastos.forEach(function(x){g(x.data.slice(0,7)).g+=x.valor;});
  return Object.keys(m).sort().map(function(k){return {k:k,v:m[k].v,g:m[k].g,l:m[k].l};});
}
function vCrescimento(C){
  var M=monthly();
  var rows=M.map(function(x,i){
    var prev=i>0?M[i-1].v:0;
    var gr=i>0&&prev>0?'<span class="chip '+(x.v>=prev?'good':'bad')+'">'+pct((x.v-prev)/prev*100)+'</span>':'<span class="chip neutral">—</span>';
    return '<tr><td>'+esc(monthLabel(x.k))+'</td><td class="num">'+fmt(x.v)+'</td><td class="num">'+fmt(x.g)+'</td><td class="num">'+fmt(x.l)+'</td><td>'+gr+'</td></tr>';
  }).join('');
  var cCaixa=C.capital>0?pct((C.saldo-C.capital)/C.capital*100):'—';

  var last=M.length?M[M.length-1]:null,prev=M.length>1?M[M.length-2]:null;

function niceTicks(min,max,count){
  if(min===max){max=min+1;}
  var raw=(max-min)/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  var step=(n<=1?1:n<=2?2:n<=5?5:10)*mag;
  var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);
  return t;
}
function drawChart(){
  var box=$('#chart');if(!box)return;
  var ev=[];
  if(+DB.capital.valor>0&&DB.capital.data)ev.push([DB.capital.data,+DB.capital.valor]);
  DB.vendas.forEach(function(v){ev.push([v.data,v.qtd*v.precoVenda]);});
  DB.gastos.forEach(function(g){ev.push([g.data,-g.valor]);});
  if(!ev.length){box.innerHTML='<p class="muted">'+T('Ainda não há movimentos para desenhar.')+'</p>';return;}
  ev.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
  var pts=[],acc=0;
  ev.forEach(function(e){acc+=e[1];var l=pts[pts.length-1];if(l&&l.d===e[0])l.y=acc;else pts.push({d:e[0],y:acc});});
  var td=today();if(pts[pts.length-1].d<td)pts.push({d:td,y:acc});
  pts.forEach(function(p){p.t=Date.parse(p.d+'T00:00:00');});
  var W=Math.max(300,box.clientWidth||600),H=250,m={l:58,r:18,t:18,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var ys=pts.map(function(p){return p.y;});
  var ticks=niceTicks(Math.min.apply(null,ys),Math.max.apply(null,ys),4);
  var y0=ticks[0],y1=ticks[ticks.length-1],t0=pts[0].t,t1=pts[pts.length-1].t;
  var X=function(t){return t1===t0?m.l+iw/2:m.l+(t-t0)/(t1-t0)*iw;};
  var Y=function(v){return m.t+ih-(v-y0)/(y1-y0||1)*ih;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T('Dinheiro em caixa ao longo do tempo'))+'">';
  ticks.forEach(function(v){var y=Y(v);s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(y+4)+'" text-anchor="end">'+kzShort(v)+'</text>';});
  var nx=Math.min(5,pts.length>1&&t1>t0?5:1);
  for(var i=0;i<nx;i++){
    var t=nx===1?t0:t0+(t1-t0)*i/(nx-1),d=new Date(t),lab=pad(d.getDate())+'/'+pad(d.getMonth()+1);
    s+='<text x="'+X(t)+'" y="'+(H-8)+'" text-anchor="'+(nx===1?'middle':i===0?'start':i===nx-1?'end':'middle')+'">'+lab+'</text>';
  }
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  if(pts.length>1){
    s+='<path d="'+line+' L'+X(t1).toFixed(1)+' '+(m.t+ih)+' L'+X(t0).toFixed(1)+' '+(m.t+ih)+' Z" style="fill:var(--chart)" fill-opacity="0.12" stroke="none"/>';
    s+='<path d="'+line+'" fill="none" style="stroke:var(--chart)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    if(pts.length<=40||last)s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3)+'" style="fill:'+(last?'var(--chart)':'var(--surface)')+';stroke:var(--chart)" stroke-width="2"><title>'+fmtD(p.d)+': '+fmt(p.y)+'</title></circle>';
  });
  var lp=pts[pts.length-1],ly=Math.max(m.t+10,Y(lp.y)-11);
  s+='<text class="endlbl" x="'+(X(lp.t)-8)+'" y="'+ly+'" text-anchor="end">'+kzShort(lp.y)+' Kz</text></svg>';
  box.innerHTML=s;
}

  var foot=P.length?'<tfoot><tr><td colspan="5">'+T('Total a arrecadar')+'</td><td class="num">'+fmt(C.stockVenda)+'</td><td class="num">'+fmt(C.stockVenda-C.stockCusto)+'</td></tr></tfoot>':'';

    '<div class="kpi"><span class="l">'+T('A arrecadar só dos produtos em alerta')+'</span><span class="v">'+fmt(alertVenda)+'</span></div>'+
    '<div class="kpi"><span class="l">'+T('Lucro previsto do stock')+'</span><span class="v">'+fmt(C.stockVenda-C.stockCusto)+'</span></div>'+
  '</div>'+table(th(T('Produto'))+th(T('Em stock'),'num')+th(T('Mínimo'),'num')+th(T('Estado'))+th(T('Venda prevista'),'num')+th(T('A arrecadar'),'num')+th(T('Lucro previsto'),'num'),rows,foot,T('Ainda não há produtos.'))+
  '<p class="hint">'+T('A arrecadar = unidades em stock × preço de venda previsto de cada produto.')+'</p></section>';

function onProdutoVenda(){
  var id=$('#v-prod').value,C=calc(),p=C.prods.find(function(x){return x.id===id;});
  if(!p)return;
  $('#v-pr').value=p.custo;$('#v-pv').value=p.precoVenda;

  if(+$('#v-qtd').value>p.atual)$('#v-qtd').value=Math.max(1,p.atual);
  updateVendaPreview();
}
function updateVendaPreview(){
  var el=$('#v-prev');if(!el)return;
  var pv=num($('#v-pv').value),pr=num($('#v-pr').value),q=parseInt($('#v-qtd').value,10)||0;
  if(isNaN(pv)||isNaN(pr)||!(pr>0)){el.textContent=T('Confirma o preço real e o preço de venda para ver a diferença.');return;}
  var d=(pv-pr)/pr*100;
  el.innerHTML=T('Diferença')+': <strong class="'+(d>=0?'pos':'neg')+'">'+pct(d)+'</strong> '+T('por unidade')+' · '+T('Lucro desta venda')+': <strong>'+fmt((pv-pr)*q)+'</strong> · '+T('Total')+': <strong>'+fmt(pv*q)+'</strong>';
}

function ferr(f,msg){var e=f.querySelector('[data-err]');if(e){if(msg)showErr(e,msg);else e.hidden=true;}return false;}
var FORMS={};

FORMS['a-signup']=async function(fd,f){
  var err=$('#s-err');err.hidden=true;
  var email=String(fd.get('email')||'').trim().toLowerCase(),pw=String(fd.get('pw')||''),pw2=String(fd.get('pw2')||'');
  if(!validEmail(email))return showErr(err,T('Escreve um endereço Gmail válido, terminado em @gmail.com.'));

  if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)return showErr(err,T('Este Gmail já tem conta. Entra ou recupera a senha.'));

FORMS['a-activate']=async function(fd,f){

/* ---------- cópias de segurança ---------- */
function backupJSON(){return JSON.stringify({app:'JINOKA',versao:2,exportado:new Date().toISOString(),dados:{capital:DB.capital,gastos:DB.gastos,produtos:DB.produtos,vendas:DB.vendas,idioma:DB.idioma}},null,1);}
function backupName(){return 'jinoka-copia-'+today()+'.json';}
function markBackup(){DB.lastBackup=Date.now();save();render();}
function doBackup(){
  var json=backupJSON();
  try{
    var blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=backupName();document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast(T('Cópia guardada no aparelho.'));markBackup();
  }catch(e){
    openModal({title:T('Copiar os dados'),body:'<p class="muted">'+T('Copia este texto e guarda-o numa nota.')+'</p><textarea id="m-json" readonly rows="8" style="font-family:var(--font-mono);font-size:12px">'+esc(json)+'</textarea>',confirmText:T('Fechar'),onSubmit:function(){markBackup();}});
  }
}
async function shareBackup(){
  var json=backupJSON(),files=[];
  try{
    if(typeof File==='function'){files=[new File([json],backupName(),{type:'application/json'}),new File([json],backupName()+'.txt',{type:'text/plain'})];}
    for(var i=0;i<files.length;i++){
      if(navigator.canShare&&navigator.canShare({files:[files[i]]})){
        await navigator.share({files:[files[i]],title:'JINOKA',text:T('Cópia de segurança da JINOKA')});
        toast(T('Cópia enviada.'));markBackup();return;
      }
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  toast(T('Este aparelho não permite partilhar ficheiros. A guardar no aparelho.'));
  doBackup();
}

/* ---------- ações ---------- */
var ACTS={
  'reload':function(){location.reload();},
  'clear-examples':function(){confirmModal(T('Apagar os exemplos'),T('Isto remove o capital, os produtos, as vendas e os gastos de exemplo. Os teus registos ficam.'),function(){
    DB.produtos=DB.produtos.filter(function(p){return !p.ex;});
    var ids={};DB.produtos.forEach(function(p){ids[p.id]=1;});
    DB.vendas=DB.vendas.filter(function(v){return !v.ex&&ids[v.produtoId];});
    DB.gastos=DB.gastos.filter(function(g){return !g.ex;});
    if(DB.capital.ex)DB.capital={valor:0,data:today(),nota:'',ex:false};
    save();render();toast(T('Exemplos apagados.'));
  },T('Apagar exemplos'));},
  'del-gasto':function(id){confirmModal(T('Apagar gasto'),T('Este gasto deixa de contar para a caixa.'),function(){DB.gastos=DB.gastos.filter(function(g){return g.id!==id;});save();render();});},
  'del-venda':function(id){confirmModal(T('Apagar venda'),T('As unidades voltam ao stock e o valor sai do total vendido.'),function(){DB.vendas=DB.vendas.filter(function(v){return v.id!==id;});save();render();});},
  'del-produto':function(id){
    var p=calc().prods.find(function(x){return x.id===id;});if(!p)return;
    if(p.sold>0)return toast(T('Este produto tem vendas registadas e não pode ser apagado.'));
    confirmModal(T('Apagar produto'),T('"{0}" deixa de existir no stock.',[p.nome]),function(){DB.produtos=DB.produtos.filter(function(x){return x.id!==id;});save();render();});
  },
  'restock':function(id){
    var p=calc().prods.find(function(x){return x.id===id;});if(!p)return;
    openModal({title:T('Repor stock de {0}',[p.nome]),body:'<p class="muted">'+T('Em stock agora: {0} unidades.',[p.atual])+'</p>'+fld(T('Unidades a acrescentar'),'qtd',{id:'m-qtd',type:'number',attrs:numAttrs(1,1)}),confirmText:T('Repor'),onSubmit:function(fd){
      var q=parseInt(fd.get('qtd'),10);if(!(q>=1))return {error:T('Escreve quantas unidades chegaram.')};
      DB.produtos.find(function(x){return x.id===id;}).qtdEntrada+=q;save();render();toast(T('Stock reposto.'));
    }});
  },
  'edit-produto':function(id){
    var p=calc().prods.find(function(x){return x.id===id;});if(!p)return;
    openModal({title:T('Editar produto'),body:fld(T('Nome'),'nome',{id:'m-nome',value:p.nome})+fld(T('Quantidade total comprada'),'qtd',{id:'m-q',type:'number',attrs:numAttrs(Math.max(0,p.sold),1),value:p.qtdEntrada})+fld(T('Preço real (custo por unidade)'),'custo',{id:'m-c',type:'number',attrs:numAttrs(0),value:p.custo})+fld(T('Preço de venda previsto'),'pv',{id:'m-pv',type:'number',attrs:numAttrs(0),value:p.precoVenda})+fld(T('Avisar quando restarem'),'min',{id:'m-min',type:'number',attrs:numAttrs(0,1),value:p.minimo})+'<p class="hint">'+T('Mudar o preço real não altera vendas já registadas.')+'</p>',onSubmit:function(fd){
      var nome=String(fd.get('nome')||'').trim(),q=parseInt(fd.get('qtd'),10),c=num(fd.get('custo')),pv=num(fd.get('pv')),mn=parseInt(fd.get('min'),10);
      if(!nome)return {error:T('Escreve o nome do produto.')};
      if(DB.produtos.some(function(x){return x.id!==id&&x.nome.toLowerCase()===nome.toLowerCase();}))return {error:T('Já existe um produto com este nome.')};
      if(isNaN(q)||q<p.sold)return {error:T('A quantidade comprada não pode ser menor que as {0} unidades já vendidas.',[p.sold])};
      if(isNaN(c)||c<0||isNaN(pv)||pv<0)return {error:T('Confirma os preços.')};
      Object.assign(DB.produtos.find(function(x){return x.id===id;}),{nome:nome,qtdEntrada:q,custo:c,precoVenda:pv,minimo:isNaN(mn)||mn<0?0:mn});
      save();render();toast(T('Produto atualizado.'));
    }});
  },
  'lock':function(){lockApp();},
  'backup':function(){doBackup();},
  'share-backup':function(){shareBackup();},
  'wipe':function(){
    confirmModal(T('Apagar todos os dados'),T('Esta ação não pode ser desfeita. Produtos, vendas, gastos e capital são apagados. A conta mantém-se.'),function(){
      DB={capital:{valor:0,data:today(),nota:'',ex:false},gastos:[],produtos:[],vendas:[],lastBackup:0,idioma:DB.idioma};save();render();toast(T('Dados apagados.'));
    },T('Apagar tudo'));
  }
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act],[data-show],[data-close],[data-scrim],[data-go]');if(!t)return;
  if(t.hasAttribute('data-scrim')){if(e.target===t)closeModal();return;}
  if(t.dataset.close!==undefined){closeModal();return;}
  if(t.dataset.go){showAuth(t.dataset.go);return;}
  if(t.dataset.show){var i=document.getElementById(t.dataset.show);i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?T('Mostrar'):T('Ocultar');return;}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);var c=document.querySelector('.tab[aria-current]');if(c)try{c.scrollIntoView({inline:'nearest',block:'nearest'});}catch(x){}return;}
  if(t.dataset.act&&ACTS[t.dataset.act])ACTS[t.dataset.act](t.dataset.id);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='v-prod')onProdutoVenda();
  if(t.id==='g-cat'){var o=t.value==='Outro';$('#g-req').textContent=o?T('(obrigatória)'):T('(opcional)');}
  if(t.id==='x-lang'){setLang(t.value);DB.idioma=LANG;save();buildHeader();render();}
  if(t.id==='f-file'&&t.files&&t.files[0]){
    var file=t.files[0],rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result),d=j&&j.dados;
        if(!d||!Array.isArray(d.produtos)||!Array.isArray(d.vendas)||!Array.isArray(d.gastos))throw new Error('x');
        confirmModal(T('Restaurar cópia'),T('Os dados atuais são substituídos pelos da cópia ({0} produtos, {1} vendas, {2} gastos).',[d.produtos.length,d.vendas.length,d.gastos.length]),function(){DB=normalize(d);DB.lastBackup=Date.now();if(DB.idioma)setLang(DB.idioma);save();buildHeader();render();toast(T('Cópia restaurada.'));},T('Restaurar'));
      }catch(x){toast(T('Este ficheiro não é uma cópia da JINOKA.'));}
    };
    rd.readAsText(file);t.value='';
  }
});
document.addEventListener('input',function(e){if(['v-pv','v-pr','v-qtd'].indexOf(e.target.id)>=0)updateVendaPreview();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------- arranque ---------- */
(async function init(){
  if(!sb){
    $('#auth').hidden=false;
    $('#auth-in').innerHTML='<div class="card stack"><h1>'+T('Falta ligar o servidor')+'</h1><p class="muted">'+T('Abre o ficheiro index.html e cola o URL e a chave do teu projeto Supabase no início do código.')+'</p></div>';
    return;
  }
  sb.auth.onAuthStateChange(function(ev,session){
    /* Não chamar o Supabase diretamente aqui dentro: usar setTimeout. */
    if(ev==='PASSWORD_RECOVERY'){recovering=true;user=session&&session.user;setTimeout(function(){showAuth('a-reset');},0);return;}
    if(ev==='SIGNED_IN'&&session&&!recovering&&!unlocked){user=session.user;setTimeout(enterApp,0);}
    if(ev==='SIGNED_OUT'&&unlocked){user=null;DB=null;$('#main').innerHTML='';setTimeout(function(){showAuth('a-login');},0);}
  });
  if(/error_code|error_description/.test(location.hash)){
    toast(T('O link expirou ou já foi usado. Pede um novo.'));
    recovering=false;
  }
  var g=await sb.auth.getSession(),ses=g&&g.data&&g.data.session;
  if(recovering){
    if(ses){user=ses.user;showAuth('a-reset');}
    else{showAuth('a-forgot');toast(T('O link expirou. Pede um novo.'));}
    return;
  }
  if(ses){user=ses.user;await enterApp();if(!unlocked)showAuth('a-login');}
  else showAuth('a-login');
})();
})();
</script>
